<div class="flex min-h-screen">
  <!-- Sidebar -->
  <aside class="fixed inset-y-0 left-0 z-40 w-64 transform bg-slate-900 text-slate-300 transition-transform lg:static lg:translate-x-0"
         [class.-translate-x-full]="!sidebarOpen()">
    <div class="flex items-center gap-2 px-6 py-5 text-lg font-bold text-white">
      <span class="flex h-9 w-9 items-center justify-center rounded-xl bg-gradient-to-br from-indigo-500 to-violet-500">N</span>
      Nimbus Admin
    </div>
    <nav class="mt-4 space-y-1 px-3">
      @for (item of nav; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="bg-indigo-600 text-white" [routerLinkActiveOptions]="{ exact: item.exact }"
           (click)="sidebarOpen.set(false)" class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium transition hover:bg-slate-800 hover:text-white">
          <span>{{ item.icon }}</span>{{ item.label }}
        </a>
      }
    </nav>
    <div class="absolute bottom-0 w-full p-4">
      <div class="rounded-xl bg-slate-800 p-4 text-xs">
        <p class="font-semibold text-white">Demo project</p>
        <p class="mt-1 text-slate-400">Angular 22 + Tailwind CSS admin dashboard with mock data.</p>
      </div>
    </div>
  </aside>
  @if (sidebarOpen()) {
    <div class="fixed inset-0 z-30 bg-slate-900/50 lg:hidden" (click)="sidebarOpen.set(false)"></div>
  }

  <!-- Main -->
  <div class="flex min-w-0 flex-1 flex-col">
    <header class="sticky top-0 z-20 flex items-center gap-4 border-b border-slate-200 bg-white/90 px-4 py-3 backdrop-blur sm:px-6">
      <button type="button" class="rounded-lg p-2 lg:hidden" (click)="sidebarOpen.set(true)" aria-label="Open menu">☰</button>
      <div class="relative hidden flex-1 sm:block">
        <input type="search" placeholder="Search…" class="w-full max-w-sm rounded-xl border border-slate-200 bg-slate-50 px-4 py-2 text-sm outline-none focus:border-indigo-500 focus:bg-white" />
      </div>
      <div class="ml-auto flex items-center gap-3">
        <button type="button" class="relative rounded-full p-2 hover:bg-slate-100" aria-label="Notifications">🔔<span class="absolute right-1.5 top-1.5 h-2 w-2 rounded-full bg-rose-500"></span></button>
        <span class="flex h-9 w-9 items-center justify-center rounded-full bg-indigo-600 text-sm font-bold text-white">SJ</span>
      </div>
    </header>
    <main class="flex-1 p-4 sm:p-6">
      <router-outlet />
    </main>
  </div>
</div>
